# Carrega backend/.env (opcional) quando o backend roda a partir da pasta backend/.
# Variáveis de ambiente do sistema têm prioridade sobre o arquivo.
spring.config.import=optional:file:.env[.properties]

server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}

springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
